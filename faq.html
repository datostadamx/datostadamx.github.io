---
layout: default
title: "FAQ"
permalink: /faq/
---
<main id="main" class="main-page">
  <!--FAQ Section-->
  <section id="faq" class="wow fadeIn"><br>
    <div class="container">
      <div class="section-header">
        <h2>FAQ</h2>
        <p>Frequent Asked Questions</p>
      </div>
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <ul id="faq-list">
            {% for item in site.data.faq %}
            <li>
              <a data-toggle="collapse" class="collapsed" href="#faq{{ forloop.index }}">{{ item.question }}<i class="fa fa-minus-circle"></i></a>
              <div id="faq{{ forloop.index }}" class="collapse" data-parent="#faq-list">
                {{ item.answer }}
              </div>
            </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </div>
  </section>
</main>
