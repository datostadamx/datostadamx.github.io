{% if site.chatbot_key %}
<!--Chatbot-->
<script src="https://comportia.soldai.com/widget/v1/hermes.plugin.js"></script>
<script type="text/javascript">
  $(function () {
    $("#chatHermes").hermes({
      key: "{{ site.chatbot_key }}",
      title: "{{ site.title }}",
      voice: false,
      init_message: "¡Hola!, Soy un agente virtual encargado de dar respuesta a tus preguntas, ¿Cuál es tu duda?",
      attention_message: "¿Tienes alguna duda?",
      timeout: "10000"
    });
  });
</script>
{% endif %}
