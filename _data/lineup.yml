      - start: "14:00"
        end: "16:00"
        sessions:
          - { room: all, kind: general, title: "Comida" }
      - start: "16:00"
        end: "16:55"
        sessions:
          - { room: s1, kind: conferencia, code: "C7", speaker: joel-suro, title: "¿Puede una simulación reemplazar la prueba en el mundo real?" }
          - { room: s2, kind: conferencia, code: "C8", speaker: mario-campos, title: "De corregir fonemas a corregir pensamientos: seis años de evolución, sin gradiente, de un bot que vendía cerveza solo a los LLMs de hoy" }
          - { room: w1, kind: taller, code: "T3", span: 2, speaker: jonathan-castillo, title: "Los números no cuadran: diagnostica discrepancias con SQL y Python" }
          - { room: w2, kind: taller, code: "T4", span: 2, speaker: mary-falcon, title: "Mapas que cuentan historias: tu primer análisis geoespacial con datos abiertos" }
      - start: "17:00"
        end: "17:55"
        sessions:
          - { room: s1, kind: conferencia, code: "C9", speaker: fatima-miranda, title: "Ciencia de datos y machine learning en la investigación: lo que ya es posible y lo que viene" }
          - { room: s2, kind: conferencia, code: "C10", speaker: alberto-lopez, title: "AI-Driven Delivery: cómo la inteligencia artificial está transformando la ingeniería de software" }
      - start: "18:00"
        end: ""
        sessions:
          - { room: all, kind: general, title: "Cierre del primer día" }

