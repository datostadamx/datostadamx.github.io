# Programa preliminar (vista previa para el equipo) — basado en "Propuesta de Programa.pdf"
# y en el registro de speakers/talleristas. Solo datos públicos: nada de correos ni teléfonos.
#
# Cada slot es una fila del horario. Cada sesión indica su sala (room) y cuántos slots
# ocupa (span, 1 por defecto). room "all" ocupa todas las salas.
# co_speakers agrega más personas a la sesión; las pills salen de speaker.
# Con bio, el nombre abre un modal; photo (opcional) es un archivo de assets/speakers/.
# kind: conferencia | taller | general | libre (sala sin actividad: "Espacio no disponible")

rooms:
  - id: s1
    name: "Escenario 1"
  - id: s2
    name: "Escenario 2"
  - id: w1
    name: "Sala de talleres 1"
  - id: w2
    name: "Sala de talleres 2"

# Etiquetas y colores de las pills (las claves se usan en speakers[].audience / level)
levels:
  ninguno: "Sin conocimientos previos"
  principiante: "Principiante"
  intermedio: "Intermedio"

audiences:
