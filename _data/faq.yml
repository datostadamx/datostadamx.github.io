# FAQ shown in the homepage FAQ section. Add/remove/edit items freely —
# the layout loops over this list automatically.
- question: "¿Datostada MX 2026 tiene costo?"
  answer: "No. La entrada es gratuita y abierta a la comunidad. Es necesario registrarse previamente para asegurar tu lugar."

- question: "¿Quiénes pueden asistir?"
  answer: "Estudiantes, profesionales, personas investigadoras, docentes, emprendedoras, representantes de empresas, gobierno, comunidades tecnológicas y cualquier persona interesada en ciencia de datos, IA y tecnologías emergentes."

- question: "¿Necesito experiencia previa en ciencia de datos o inteligencia artificial?"
  answer: "No. Habrá contenidos, conversaciones y espacios de conexión para distintos niveles de experiencia e intereses."

- question: "¿Puedo asistir sólo un día?"
  answer: "Sí. Durante el registro podrás indicar los días en los que planeas asistir."

- question: "¿Habrá constancia de participación?"
  answer: "La información sobre constancias y sus criterios de emisión se comunicará próximamente. Se recomienda registrar correctamente tu nombre y correo electrónico."

- question: "¿Habrá talleres?"
  answer: 'Sí. Habrá 6 talleres prácticos de dos horas sobre agentes de IA, SQL y Python, análisis geoespacial, búsqueda de imágenes con embeddings y más. Consulta horarios y salas en el <a href="/lineup/" style="color:var(--mint)">programa completo</a>. Algunos talleres podrían requerir registro previo por capacidad limitada.'

- question: "¿Puedo presentar mi startup, proyecto o comunidad?"
  answer: 'Sí. Puedes registrar un stand en <a href="https://docs.google.com/forms/d/e/1FAIpQLScgNJorygllLtsUI4qxS292HsxZyayhB4aAOK--3VwhZqt98Q/viewform" target="_blank" rel="noopener" style="color:var(--mint)">este formulario</a>. Además, el sábado 14 tendremos un open space para que comunidades y startups presenten sus proyectos; si te interesa participar, escríbenos a <a href="mailto:datostadamx2026@gmail.com?subject=Open%20space%20Datostada%20MX%202026" style="color:var(--mint)">datostadamx2026@gmail.com</a>.'

- question: "¿Puedo asistir si vengo de otro estado o país?"
  answer: "Sí. Datostada MX es un evento abierto. Consulta la sección “Sede” para planear tu llegada a Mérida."

- question: "¿Cómo puedo patrocinar o participar como aliado?"
  answer: 'Escríbenos a <a href="mailto:datostadamx2026@gmail.com?subject=Patrocinio%20Datostada%20MX%202026" style="color:var(--mint)">datostadamx2026@gmail.com</a> con el asunto “Patrocinio Datostada MX 2026”.'
